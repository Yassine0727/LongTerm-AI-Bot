<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LongTerm AI - Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            border: 1px solid #2a2a2a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #f7931a, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .status-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .status-badge.running {
            background: #064e3b;
            color: #34d399;
            border: 1px solid #065f46;
        }
        .status-badge.stopped {
            background: #4a1a1a;
            color: #f87171;
            border: 1px solid #7f1d1d;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }
        .status-dot.running {
            background: #34d399;
            animation: pulse 2s infinite;
        }
        .status-dot.stopped {
            background: #f87171;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 25px 0;
        }
        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-start {
            background: #065f46;
            color: #34d399;
        }
        .btn-start:hover:not(:disabled) {
            background: #047857;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(6, 95, 70, 0.3);
        }
        .btn-stop {
            background: #7f1d1d;
            color: #f87171;
        }
        .btn-stop:hover:not(:disabled) {
            background: #991b1b;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(127, 29, 29, 0.3);
        }
        .btn-restart {
            background: #1e3a5f;
            color: #60a5fa;
            grid-column: span 2;
        }
        .btn-restart:hover:not(:disabled) {
            background: #1e40af;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(30, 58, 95, 0.3);
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .info-item {
            background: #111;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #222;
        }
        .info-item label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item .value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 4px;
            color: #e5e5e5;
        }
        .info-item .value.green {
            color: #34d399;
        }
        .info-item .value.yellow {
            color: #fbbf24;
        }
        .log {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 14px;
            max-height: 140px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #555;
            border: 1px solid #1a1a1a;
            margin-top: 20px;
        }
        .log .entry {
            padding: 3px 0;
            border-bottom: 1px solid #111;
        }
        .log .time {
            color: #333;
            margin-right: 8px;
        }
        .log .info { color: #60a5fa; }
        .log .success { color: #34d399; }
        .log .error { color: #f87171; }
        .log .warning { color: #fbbf24; }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: #333;
        }
        .footer code {
            background: #0a0a0a;
            padding: 2px 8px;
            border-radius: 4px;
            color: #555;
        }
        .refresh-btn {
            background: #222;
            border: 1px solid #333;
            color: #888;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
            margin-top: 10px;
        }
        .refresh-btn:hover {
            background: #333;
            color: #ccc;
        }
        @media (max-width: 500px) {
            .container { padding: 20px; }
            .controls { grid-template-columns: 1fr; }
            .btn-restart { grid-column: span 1; }
            .info-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- En-tête -->
        <div class="header">
            <div class="logo">⬡ LongTerm AI</div>
            <div class="subtitle">Investment Analysis Bot — Control Panel</div>
        </div>

        <!-- Statut -->
        <div class="status-container">
            <div id="statusBadge" class="status-badge stopped">
                <span class="status-dot stopped"></span>
                <span id="statusText">Arrêté</span>
            </div>
        </div>

        <!-- Boutons de contrôle -->
        <div class="controls">
            <button id="btnStart" class="btn btn-start">▶ Démarrer</button>
            <button id="btnStop" class="btn btn-stop" disabled>⏹ Arrêter</button>
            <button id="btnRestart" class="btn btn-restart">⟳ Redémarrer</button>
        </div>

        <!-- Informations -->
        <div class="info-grid">
            <div class="info-item">
                <label>📊 Analyses</label>
                <div class="value" id="newsCount">0</div>
            </div>
            <div class="info-item">
                <label>🔔 Alertes</label>
                <div class="value" id="alertsCount">0</div>
            </div>
            <div class="info-item">
                <label>⏱️ Uptime</label>
                <div class="value" id="uptime">-</div>
            </div>
        </div>

        <!-- Logs -->
        <div class="log" id="logContainer">
            <div class="entry"><span class="time">[System]</span> <span class="info">Bot prêt - En attente de démarrage</span></div>
        </div>

        <!-- Pied de page -->
        <div class="footer">
            <button class="refresh-btn" onclick="refreshStatus()">⟳ Rafraîchir</button>
            <br>
            <code>http://localhost:8000/api/status</code>
        </div>
    </div>

    <script>
        // ==========================================
        // Configuration
        // ==========================================
        const API_BASE = 'http://localhost:8000/api';
        const PASSWORD = 'admin123';

        // ==========================================
        // Éléments DOM
        // ==========================================
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnRestart = document.getElementById('btnRestart');
        const newsCount = document.getElementById('newsCount');
        const alertsCount = document.getElementById('alertsCount');
        const uptime = document.getElementById('uptime');
        const logContainer = document.getElementById('logContainer');

        // ==========================================
        // Fonctions API
        // ==========================================
        async function apiCall(endpoint, method = 'GET') {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: method,
                    headers: {
                        'password': PASSWORD,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.detail || `Erreur ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                addLog(`❌ Erreur: ${error.message}`, 'error');
                return null;
            }
        }

        async function getStatus() {
            const data = await apiCall('/status');
            if (data) {
                updateUI(data);
            }
            return data;
        }

        async function startBot() {
            btnStart.disabled = true;
            addLog('🚀 Démarrage du bot...', 'info');
            const data = await apiCall('/start', 'POST');
            if (data) {
                addLog('✅ ' + data.message, 'success');
                await getStatus();
            }
            btnStart.disabled = false;
        }

        async function stopBot() {
            btnStop.disabled = true;
            addLog('🛑 Arrêt du bot...', 'warning');
            const data = await apiCall('/stop', 'POST');
            if (data) {
                addLog('✅ ' + data.message, 'success');
                await getStatus();
            }
            btnStop.disabled = false;
        }

        async function restartBot() {
            btnRestart.disabled = true;
            addLog('⟳ Redémarrage du bot...', 'info');
            await stopBot();
            setTimeout(async () => {
                await startBot();
                btnRestart.disabled = false;
            }, 1000);
        }

        // ==========================================
        // Mise à jour de l'UI
        // ==========================================
        function updateUI(data) {
            if (!data) return;

            const running = data.running;

            // Status badge
            if (running) {
                statusBadge.className = 'status-badge running';
                statusText.textContent = 'En cours';
                btnStart.disabled = true;
                btnStop.disabled = false;
            } else {
                statusBadge.className = 'status-badge stopped';
                statusText.textContent = 'Arrêté';
                btnStart.disabled = false;
                btnStop.disabled = true;
            }

            // Uptime
            if (data.start_time) {
                const start = new Date(data.start_time);
                const now = new Date();
                const diff = Math.floor((now - start) / 1000);
                const hours = Math.floor(diff / 3600);
                const minutes = Math.floor((diff % 3600) / 60);
                uptime.textContent = `${hours}h ${minutes}m`;
            } else {
                uptime.textContent = '-';
            }
        }

        // ==========================================
        // Rafraîchir
        // ==========================================
        async function refreshStatus() {
            await getStatus();
            addLog('🔄 Statut rafraîchi', 'info');
        }

        // ==========================================
        // Logs
        // ==========================================
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'entry';
            const time = new Date().toLocaleTimeString();
            const typeClass = {
                'info': 'info',
                'success': 'success',
                'error': 'error',
                'warning': 'warning'
            } [type] || 'info';
            entry.innerHTML = `<span class="time">[${time}]</span> <span class="${typeClass}">${message}</span>`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;

            // Limiter à 50 entrées
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }

        // ==========================================
        // Événements
        // ==========================================
        btnStart.addEventListener('click', startBot);
        btnStop.addEventListener('click', stopBot);
        btnRestart.addEventListener('click', restartBot);

        // ==========================================
        // Démarrer
        // ==========================================
        addLog('🔄 Monitoring actif - Mise à jour toutes les 10s', 'info');
        getStatus();

        // Rafraîchir automatiquement
        setInterval(getStatus, 10000);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' && !e.ctrlKey && !e.metaKey) {
                refreshStatus();
            }
        });

        console.log('🟢 LongTerm AI Control Panel chargé');
        console.log('📋 API:', API_BASE);
        console.log('🔑 Mot de passe:', PASSWORD);
        console.log('⌨️ Appuyez sur "r" pour rafraîchir');
    </script>
</body>
</html>
